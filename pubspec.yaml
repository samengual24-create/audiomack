name: audiomack
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  google_sign_in: ^7.2.0
  cloud_firestore: ^7.1.0
  firebase_storage: ^14.0.1
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  file_selector: ^1.1.0
  google_fonts: ^9.0.0
  material_ui: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - lib/assets/logo.png